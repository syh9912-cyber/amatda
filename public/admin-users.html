<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>아맞다 · 가입자 관리</title>
<style>
  :root {
    --accent: #FF8C5A;
    --accent-dark: #E67A4A;
    --bg: #F7F7F9;
    --card: #FFFFFF;
    --border: #E5E5EA;
    --text: #1C1C1E;
    --text-light: #8E8E93;
    --paid: #34C759;
    --trial: #FF9500;
    --free: #C7C7CC;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Pretendard, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .gate {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    padding: 24px;
  }
  .gate h1 { font-size: 20px; margin: 0 0 4px; }
  .gate p { color: var(--text-light); font-size: 13px; margin: 0; }
  .gate input {
    width: 280px;
    max-width: 80vw;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 15px;
  }
  .gate button, .btn {
    padding: 12px 20px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .gate button:hover, .btn:hover { background: var(--accent-dark); }
  .gate .err { color: #FF3B30; font-size: 13px; min-height: 18px; }

  .app { display: none; max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }
  .app.show { display: block; }
  header.top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  header.top h1 { font-size: 20px; margin: 0; }
  header.top button.logout {
    background: none; border: 1px solid var(--border); color: var(--text-light);
    padding: 8px 14px; border-radius: 8px; font-size: 13px; cursor: pointer;
  }

  .summary { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 18px;
    min-width: 100px;
  }
  .card .n { font-size: 24px; font-weight: 700; }
  .card .l { font-size: 12px; color: var(--text-light); margin-top: 2px; }

  .toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
    flex-wrap: wrap;
    align-items: center;
  }
  .toolbar select, .toolbar input[type="text"] {
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    background: #fff;
  }
  .toolbar input[type="text"] { flex: 1; min-width: 160px; }
  .toolbar .btn.small { padding: 9px 16px; font-size: 14px; }

  table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
  th.sortable { cursor: pointer; user-select: none; white-space: nowrap; }
  th.sortable:hover { color: #111; }
  th.sortable .arrow { font-size: 10px; color: #888; }
  tbody tr.clickable { cursor: pointer; }
  tbody tr.clickable:hover { background: #f5f7fa; }
  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); align-items: center; justify-content: center; z-index: 50; padding: 20px; }
  .modal-box { background: #fff; border-radius: 12px; width: 100%; max-width: 720px; max-height: 86vh; display: flex; flex-direction: column; box-shadow: 0 10px 40px rgba(0,0,0,.2); }
  .modal-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid #eee; }
  .modal-body { padding: 16px 20px 22px; overflow-y: auto; }
  .modal-body h4 { margin: 18px 0 8px; font-size: 13px; color: #555; }
  .modal-body h4:first-child { margin-top: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: #f1f3f6; border-radius: 999px; padding: 5px 11px; font-size: 12px; }
  .chip b { color: #1a73e8; }
  table.mini { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.mini th, table.mini td { border-bottom: 1px solid #f0f0f0; padding: 6px 8px; text-align: left; }
  table.mini th { color: #888; font-weight: 600; }
  thead th {
    text-align: left; font-size: 12px; color: var(--text-light);
    padding: 10px 12px; border-bottom: 1px solid var(--border); background: #FAFAFA;
    white-space: nowrap;
  }
  tbody td { padding: 10px 12px; font-size: 13px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #FAFAFA; }

  .badge {
    display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; color: #fff;
  }
  .badge.PAID { background: var(--paid); }
  .badge.TRIAL { background: var(--trial); }
  .badge.FREE { background: var(--free); color: #555; }

  .muted { color: var(--text-light); }
  .empty { text-align: center; padding: 40px; color: var(--text-light); }
  .table-wrap { overflow-x: auto; }
</style>
</head>
<body>

  <!-- 비밀번호 게이트 -->
  <div class="gate" id="gate">
    <h1>🔒 아맞다 관리자</h1>
    <p>관리자 키를 입력하세요</p>
    <input type="password" id="keyInput" placeholder="관리자 키" autocomplete="off" />
    <button id="enterBtn">입장</button>
    <div class="err" id="gateErr"></div>
  </div>

  <!-- 본문 -->
  <div class="app" id="app">
    <header class="top">
      <h1>가입자 관리</h1>
      <button class="logout" id="logoutBtn">키 재입력</button>
    </header>

    <div class="summary" id="summary"></div>

    <div class="toolbar">
      <select id="daysSelect">
        <option value="7">최근 7일</option>
        <option value="30">최근 30일</option>
        <option value="90">최근 90일</option>
        <option value="" selected>전체</option>
      </select>
      <input type="text" id="searchInput" placeholder="이메일 또는 닉네임 검색" />
      <button class="btn small" id="refreshBtn">새로고침</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="sortable" data-key="createdAt">가입일시 <span class="arrow">▼</span></th>
            <th>방식</th>
            <th>이메일</th>
            <th>닉네임</th>
            <th>상태</th>
            <th class="sortable" data-key="lastActiveAt">최근 접속 <span class="arrow"></span></th>
            <th class="sortable" data-key="apiCallCount">API 호출 <span class="arrow"></span></th>
            <th class="sortable" data-key="apiCostUsd">API 비용 <span class="arrow"></span></th>
            <th>uid</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="emptyMsg" style="display:none;">데이터가 없습니다</div>
    </div>
  </div>

  <div id="actModal" class="modal">
    <div class="modal-box">
      <div class="modal-head">
        <strong id="actTitle"></strong>
        <button class="btn small" id="actClose">닫기</button>
      </div>
      <div id="actBody" class="modal-body"></div>
    </div>
  </div>

<script>
(function () {
  var API_BASE = 'https://api-usglfifguq-uc.a.run.app';
  var STORAGE_KEY = 'amatda_admin_key';
  // 참고용 대략 환율 — 실제 청구서와 다를 수 있음(원화는 괄호 안 참고치로만 표시)
  var USD_KRW_APPROX = 1400;
  var allUsers = [];

  function fmtCost(usd) {
    if (!usd) return '$0';
    var krw = Math.round(usd * USD_KRW_APPROX);
    return '$' + usd.toFixed(4) + ' <span class="muted">(약 ₩' + krw.toLocaleString('ko-KR') + ')</span>';
  }

  var gateEl = document.getElementById('gate');
  var appEl = document.getElementById('app');
  var keyInput = document.getElementById('keyInput');
  var gateErr = document.getElementById('gateErr');

  function getKey() { return sessionStorage.getItem(STORAGE_KEY) || ''; }
  function setKey(k) { sessionStorage.setItem(STORAGE_KEY, k); }
  function clearKey() { sessionStorage.removeItem(STORAGE_KEY); }

  function fmtDate(iso) {
    if (!iso) return '-';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '-';
    var pad = function (n) { return String(n).padStart(2, '0'); };
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function statusLabel(u) {
    if (u.status === 'PAID') {
      var exp = u.premiumExpiresAt ? fmtDate(u.premiumExpiresAt).slice(0, 10) : '';
      return '<span class="badge PAID">PAID</span> <span class="muted">' + exp + '</span>';
    }
    if (u.status === 'TRIAL') {
      return '<span class="badge TRIAL">TRIAL</span> <span class="muted">D-' + u.trialDaysLeft + '</span>';
    }
    return '<span class="badge FREE">FREE</span>';
  }

  // 정렬 상태 — 기본은 가입일 최신순(백엔드도 동일 순서로 내려줌)
  var sortKey = 'createdAt';
  var sortDir = 'desc';

  function sortUsers(list) {
    var arr = list.slice();
    arr.sort(function (a, b) {
      var x = a[sortKey], y = b[sortKey];
      // 날짜 문자열(ISO)은 사전순 비교가 곧 시간순. 숫자는 숫자 비교.
      if (typeof x === 'number' || typeof y === 'number') {
        x = x || 0; y = y || 0;
        return sortDir === 'desc' ? y - x : x - y;
      }
      x = x || ''; y = y || '';
      return sortDir === 'desc' ? String(y).localeCompare(String(x)) : String(x).localeCompare(String(y));
    });
    return arr;
  }

  function updateArrows() {
    var ths = document.querySelectorAll('th.sortable');
    for (var i = 0; i < ths.length; i++) {
      var el = ths[i].querySelector('.arrow');
      if (!el) continue;
      el.textContent = ths[i].getAttribute('data-key') === sortKey ? (sortDir === 'desc' ? '▼' : '▲') : '';
    }
  }

  function render(users) {
    var tbody = document.getElementById('rows');
    var emptyMsg = document.getElementById('emptyMsg');
    tbody.innerHTML = '';
    if (!users.length) {
      emptyMsg.style.display = 'block';
      return;
    }
    emptyMsg.style.display = 'none';
    sortUsers(users).forEach(function (u) {
      var tr = document.createElement('tr');
      tr.className = 'clickable';
      tr.title = '클릭하면 활동 내역을 봅니다';
      tr.addEventListener('click', function () { openActivity(u); });
      tr.innerHTML =
        '<td>' + fmtDate(u.createdAt) + '</td>' +
        '<td>' + (u.authProvider || '-') + '</td>' +
        '<td>' + (u.email || '-') + '</td>' +
        '<td>' + (u.nickname || '-') + '</td>' +
        '<td>' + statusLabel(u) + '</td>' +
        '<td>' + fmtDate(u.lastActiveAt) + '</td>' +
        '<td>' + (u.apiCallCount || 0) + '회</td>' +
        '<td>' + fmtCost(u.apiCostUsd) + '</td>' +
        '<td class="muted" style="font-size:11px;">' + u.id + '</td>';
      tbody.appendChild(tr);
    });
    updateArrows();
  }

  // 라벨은 앱에서 사용자가 보는 기능명과 일치시킨다(babyTrackerDays = '아기시간')
  var FEATURE_LABEL = {
    children: '등록 아이', trackerDays: '아기시간(기록일)', aiCoaching: 'AI 상담',
    album: '성장앨범(장)', vaccination: '예방접종', familyFeed: '가족피드(글)',
    momGroup: '맘그룹(글)'
  };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function openActivity(u) {
    var modal = document.getElementById('actModal');
    var body = document.getElementById('actBody');
    document.getElementById('actTitle').textContent = (u.email || u.nickname || u.id) + ' 활동 내역';
    body.innerHTML = '<div class="empty">불러오는 중…</div>';
    modal.style.display = 'flex';

    fetch(API_BASE + '/api/admin/users/' + encodeURIComponent(u.id) + '/activity', {
      headers: { 'x-admin-key': getKey() }, cache: 'no-store'
    })
      .then(function (r) { return r.json(); })
      .then(function (json) {
        if (!json || !json.success) { body.innerHTML = '<div class="empty">조회 실패</div>'; return; }
        var d = json.data;
        var html = '';

        if (d.babyTime) {
          var bt = d.babyTime;
          html += '<h4>아기시간 사용 여부</h4><div class="chips">' +
            '<span class="chip" style="background:' + (bt.isUsing ? '#e6f4ea' : '#fdecea') + ';">' +
            (bt.isUsing ? '✅ 사용 중' : '❌ 미사용') + '</span>' +
            '<span class="chip">기록한 날 <b>' + bt.daysRecorded + '</b>일</span>' +
            '<span class="chip">총 기록 <b>' + bt.totalRecords + '</b>건</span>' +
            '<span class="chip">마지막 <b>' + esc(bt.lastDate || '-') + '</b></span></div>';
        }

        html += '<h4>기능별 사용량</h4><div class="chips">';
        Object.keys(d.featureUsage).forEach(function (k) {
          html += '<span class="chip">' + esc(FEATURE_LABEL[k] || k) + ' <b>' + d.featureUsage[k] + '</b></span>';
        });
        html += '</div>';

        var cats = Object.keys(d.categoryCounts || {});
        if (cats.length) {
          cats.sort(function (a, b) { return d.categoryCounts[b] - d.categoryCounts[a]; });
          html += '<h4>상담 카테고리</h4><div class="chips">';
          cats.forEach(function (c) {
            html += '<span class="chip">' + esc(c) + ' <b>' + d.categoryCounts[c] + '</b></span>';
          });
          html += '</div>';
        }

        html += '<h4>AI 사용 합계</h4><div class="chips">' +
          '<span class="chip">호출 <b>' + d.totals.aiCallCount + '</b>회</span>' +
          '<span class="chip">비용 <b>' + fmtCost(d.totals.aiCostUsd) + '</b></span></div>';

        if (d.daily && d.daily.length) {
          html += '<h4>일별 AI 사용</h4><table class="mini"><tr><th>날짜</th><th>호출</th><th>토큰</th><th>비용</th></tr>';
          d.daily.forEach(function (x) {
            html += '<tr><td>' + esc(x.date) + '</td><td>' + x.callCount + '회</td><td>' +
              (x.totalTokens || 0).toLocaleString() + '</td><td>' + fmtCost(x.costUsd) + '</td></tr>';
          });
          html += '</table>';
        }

        if (d.coaching && d.coaching.length) {
          html += '<h4>최근 상담</h4><table class="mini"><tr><th>시각</th><th>분류</th><th>내용</th><th>위험</th></tr>';
          d.coaching.slice(0, 20).forEach(function (x) {
            html += '<tr><td>' + fmtDate(x.at) + '</td><td>' + esc(x.category) + '</td><td>' +
              esc(x.preview) + '</td><td>' + (x.redFlag ? '⚠️' : '') + '</td></tr>';
          });
          html += '</table>';
        }

        if (d.note) html += '<p class="muted" style="margin-top:14px;font-size:12px;">ⓘ ' + esc(d.note) + '</p>';
        body.innerHTML = html;
      })
      .catch(function () { body.innerHTML = '<div class="empty">네트워크 오류</div>'; });
  }

  function renderSummary(summary) {
    var el = document.getElementById('summary');
    el.innerHTML =
      '<div class="card"><div class="n">' + summary.total + '</div><div class="l">전체</div></div>' +
      '<div class="card"><div class="n">' + summary.paid + '</div><div class="l">유료(PAID)</div></div>' +
      '<div class="card"><div class="n">' + summary.trial + '</div><div class="l">체험중</div></div>' +
      '<div class="card"><div class="n">' + summary.free + '</div><div class="l">무료</div></div>' +
      '<div class="card"><div class="n">' + (summary.totalApiCallCount || 0) + '</div><div class="l">전체 API 호출</div></div>' +
      '<div class="card"><div class="n" style="font-size:16px;">' + fmtCost(summary.totalApiCostUsd) + '</div><div class="l">전체 누적 API 비용</div></div>';
  }

  function applySearch() {
    var q = document.getElementById('searchInput').value.trim().toLowerCase();
    if (!q) { render(allUsers); return; }
    var filtered = allUsers.filter(function (u) {
      return (u.email || '').toLowerCase().indexOf(q) !== -1 ||
             (u.nickname || '').toLowerCase().indexOf(q) !== -1;
    });
    render(filtered);
  }

  function load() {
    var days = document.getElementById('daysSelect').value;
    var url = API_BASE + '/api/admin/users?limit=1000' + (days ? '&days=' + encodeURIComponent(days) : '');
    fetch(url, { headers: { 'x-admin-key': getKey() }, cache: 'no-store' })
      .then(function (res) {
        if (res.status === 401 || res.status === 503) {
          clearKey();
          showGate('키가 올바르지 않거나 서버 설정이 안 되어 있습니다');
          return null;
        }
        return res.json();
      })
      .then(function (json) {
        if (!json) return;
        if (!json.success) {
          alert(json.error || '조회 실패');
          return;
        }
        allUsers = json.data.users;
        renderSummary(json.data.summary);
        applySearch();
      })
      .catch(function () { alert('네트워크 오류'); });
  }

  function showApp() {
    gateEl.style.display = 'none';
    appEl.classList.add('show');
    load();
  }

  function showGate(err) {
    appEl.classList.remove('show');
    gateEl.style.display = 'flex';
    gateErr.textContent = err || '';
    keyInput.value = '';
    keyInput.focus();
  }

  // 컬럼 헤더 클릭 → 정렬 전환 (같은 컬럼 재클릭 시 오름/내림 토글)
  var sortableThs = document.querySelectorAll('th.sortable');
  for (var si = 0; si < sortableThs.length; si++) {
    sortableThs[si].addEventListener('click', function () {
      var key = this.getAttribute('data-key');
      if (sortKey === key) { sortDir = (sortDir === 'desc' ? 'asc' : 'desc'); }
      else { sortKey = key; sortDir = 'desc'; }
      applySearch();
    });
  }

  document.getElementById('actClose').addEventListener('click', function () {
    document.getElementById('actModal').style.display = 'none';
  });
  document.getElementById('actModal').addEventListener('click', function (e) {
    if (e.target === this) this.style.display = 'none';
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') document.getElementById('actModal').style.display = 'none';
  });

  document.getElementById('enterBtn').addEventListener('click', function () {
    var v = keyInput.value.trim();
    if (!v) return;
    setKey(v);
    showApp();
  });
  keyInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') document.getElementById('enterBtn').click();
  });
  document.getElementById('logoutBtn').addEventListener('click', function () {
    clearKey();
    showGate('');
  });
  document.getElementById('refreshBtn').addEventListener('click', load);
  document.getElementById('daysSelect').addEventListener('change', load);
  document.getElementById('searchInput').addEventListener('input', applySearch);

  if (getKey()) { showApp(); } else { showGate(''); }
})();
</script>
</body>
</html>
